name: Export Repository Code

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export-code:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate code dump
        run: |
          OUTPUT=code-dump.md
          > "$OUTPUT"

          find . -type f \
            \( -name "*.cs" -o -name "*.csproj" -o -name "*.sln" \) \
            -not -path "*/bin/*" \
            -not -path "*/obj/*" \
            -not -path "*/.git/*" \
            | sort | while read file; do

              echo "# $file" >> "$OUTPUT"
              echo '```csharp' >> "$OUTPUT"
              cat "$file" >> "$OUTPUT"
              echo '```' >> "$OUTPUT"
              echo >> "$OUTPUT"
            done

      - name: Commit dump
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add code-dump.md

          git diff --staged --quiet || \
          git commit -m "Update code dump"

          git push
